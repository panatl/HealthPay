plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.healthpay'
version = '1.0.0'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot WebFlux for reactive support
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    
    // GraphQL Spring Boot with Federation support
    implementation 'com.netflix.graphql.dgs:graphql-dgs-spring-boot-starter:8.1.1'
    implementation 'com.netflix.graphql.dgs:graphql-dgs-extended-scalars:8.1.1'
    
    // Reactor Core
    implementation 'io.projectreactor:reactor-core'
    
    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
